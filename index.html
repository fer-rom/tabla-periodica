<!doctype html>
<html lang="es" data-lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="meta.title"></title>
    <meta name="description" data-i18n-attr="content:meta.description" />
    <meta name="theme-color" content="#eef2ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13111c" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="%SITE_URL%" />
    <link rel="alternate" hreflang="es" href="%SITE_URL%?lang=es" />
    <link rel="alternate" hreflang="en" href="%SITE_URL%?lang=en" />
    <link rel="alternate" hreflang="x-default" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" data-i18n-attr="content:meta.title" />
    <meta property="og:title" data-i18n-attr="content:meta.title" />
    <meta property="og:description" data-i18n-attr="content:meta.description" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og/home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/atkinson-next-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Antes del primer pintado: idioma y tema, para evitar destellos.
      (function () {
        var d = document.documentElement;
        function get(k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        }
        var q = new URLSearchParams(location.search).get('lang');
        var nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'es').toLowerCase();
        var lang = q === 'es' || q === 'en' ? q : get('tp.lang') || (nav.indexOf('es') === 0 ? 'es' : 'en');
        if (lang !== 'es' && lang !== 'en') lang = 'es';
        d.lang = lang;
        d.setAttribute('data-lang', lang);
        var theme = get('tp.theme');
        if (theme !== 'light' && theme !== 'dark')
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <a class="skip" href="#el-1" data-i18n="header.skip"></a>

    <header class="top">
      <div class="wrap">
        <a class="brand" href="./">
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
            <rect x="0.5" y="0.5" width="27" height="27" rx="6" fill="none" stroke="currentColor" opacity=".35" />
            <!-- Serie de Balmer del hidrógeno: Hα 656 nm, Hβ 486 nm, Hγ 434 nm, Hδ 410 nm -->
            <rect x="21" y="5" width="2.4" height="18" rx="1.2" fill="#e5383b" />
            <rect x="12.6" y="5" width="2" height="18" rx="1" fill="#22b8cf" />
            <rect x="8.4" y="5" width="1.8" height="18" rx=".9" fill="#5c6bf0" />
            <rect x="5.6" y="5" width="1.6" height="18" rx=".8" fill="#8f5cf0" />
          </svg>
          <h1 id="brand-title" data-i18n="meta.title"></h1>
        </a>
        <nav class="sections" data-i18n-attr="aria-label:header.nav">
          <a href="#tabla" data-i18n="header.navTable"></a>
          <a href="#tendencias" data-i18n="header.navTrends"></a>
          <a href="#masa-molar" data-i18n="header.navCalculator"></a>
        </nav>
        <div class="prefs">
          <button
            class="switch"
            id="lang-switch"
            type="button"
            role="switch"
            aria-checked="false"
            data-i18n-attr="aria-label:header.languageSwitch"
          >
            <span class="knob" aria-hidden="true"></span>
            <span class="opt" aria-hidden="true">ES</span>
            <span class="opt" aria-hidden="true">EN</span>
          </button>
          <button
            class="switch"
            id="theme-switch"
            type="button"
            role="switch"
            aria-checked="false"
            data-i18n-attr="aria-label:header.themeSwitch"
          >
            <span class="knob" aria-hidden="true"></span>
            <span class="opt" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                />
              </svg>
            </span>
            <span class="opt" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z" />
              </svg>
            </span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="stage wrap" id="tabla" data-i18n-attr="aria-label:header.navTable">
        <div class="toolbar">
          <div class="search" role="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" stroke-linecap="round" />
            </svg>
            <label class="sr-only" for="q" data-i18n="toolbar.searchLabel"></label>
            <input
              id="q"
              type="search"
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="search"
              data-i18n-attr="placeholder:toolbar.searchPlaceholder"
              aria-describedby="status"
            />
            <button class="clear" type="button" hidden data-i18n-attr="aria-label:toolbar.clearSearch">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 6l12 12M18 6 6 18" stroke-linecap="round" />
              </svg>
            </button>
          </div>
          <div class="tool-group">
            <span class="sr-only" id="view-label" data-i18n="toolbar.view"></span>
            <div class="seg" role="group" aria-labelledby="view-label">
              <button type="button" data-view="category" aria-pressed="true" data-i18n="toolbar.viewCategory"></button>
              <button type="button" data-view="heatmap" aria-pressed="false" data-i18n="toolbar.viewHeatmap"></button>
              <button
                type="button"
                data-view="temperature"
                aria-pressed="false"
                data-i18n="toolbar.viewTemperature"
              ></button>
            </div>
            <label class="sr-only" for="heat-prop" data-i18n="toolbar.property"></label>
            <select class="select" id="heat-prop" hidden>
              <option value="electronegativity" data-i18n="properties.electronegativity"></option>
              <option value="atomicRadius" data-i18n="properties.atomicRadius"></option>
              <option value="ionizationEnergy" data-i18n="properties.ionizationEnergy"></option>
              <option value="density" data-i18n="properties.density"></option>
              <option value="meltingPoint" data-i18n="properties.meltingPoint"></option>
              <option value="year" data-i18n="properties.year"></option>
            </select>
          </div>
          <div class="tool-group tool-end">
            <button class="btn" type="button" id="filters-btn" aria-haspopup="dialog" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 6h16M7 12h10M10 18h4" stroke-linecap="round" />
              </svg>
              <span data-i18n="toolbar.filters"></span>
            </button>
            <button class="btn" type="button" id="compare-btn" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="5" width="7" height="14" rx="1.5" />
                <rect x="14" y="5" width="7" height="14" rx="1.5" />
              </svg>
              <span data-i18n="toolbar.compare"></span>
            </button>
            <button
              class="btn icon"
              type="button"
              id="fit-btn"
              aria-pressed="false"
              data-i18n-attr="aria-label:toolbar.zoomOut"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div class="scroller" id="scroller">
          <!--ptable-->
        </div>
        <p id="grid-hint" class="sr-only" data-i18n="grid.keyboardHint"></p>
      </section>

      <section class="wrap block" id="tendencias" aria-labelledby="trends-title">
        <h2 id="trends-title" data-i18n="trends.title"></h2>
        <p class="lede" data-i18n="trends.intro"></p>
        <div id="trends-root"></div>
      </section>

      <section class="wrap block" id="masa-molar" aria-labelledby="calc-title">
        <h2 id="calc-title" data-i18n="calculator.title"></h2>
        <p class="lede" data-i18n="calculator.intro"></p>
        <div id="calc-root"></div>
      </section>
    </main>

    <footer class="foot">
      <div class="wrap">
        <p>
          <span data-i18n="footer.sources" data-i18n-params="date:%SNAPSHOT_DATE%"></span>
          <a href="%REPO_URL%/blob/main/data/sources.json" data-i18n="footer.sourcesLink"></a>.
          <a href="%REPO_URL%" data-i18n="footer.code"></a>.
          <span data-i18n="footer.license"></span>
        </p>
        <p class="net" id="net" role="status"></p>
      </div>
    </footer>

    <dialog class="sheet" id="panel" aria-labelledby="panel-title"></dialog>
    <dialog class="sheet sheet-small" id="filters-dialog" aria-labelledby="filters-title"></dialog>
    <div class="tray" id="compare-tray" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
